[package]
name = "libretro-renderer"
version = "0.1.0"
edition = "2024"
description = "Offline RetroArch shader renderer for video files powered by headless Vulkan"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["libretro", "retroarch", "shader", "vulkan", "video"]
categories = ["command-line-utilities", "multimedia::video", "rendering"]

[dependencies]
librashader = { version = "0.12.0", features = ["runtime-vk"] }
ash = "0.38"
gpu-allocator = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
indicatif = "0.17"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
